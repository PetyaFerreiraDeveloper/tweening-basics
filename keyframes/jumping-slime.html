<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jumping slime</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <h1 class="title">Animating jumping slide</h1>
      <!-- Control Buttons -->
      <div class="controls">
        <button class="play">Play</button>
        <button class="pause">Pause</button>
        <button class="restart">Restart</button>
        <button class="reverse">Reverse</button>
      </div>
      <div class="keyframes">
        <div class="slime"></div>
      </div>
    </main>
    <script type="module" src="/keyframes/js/controls.js"></script>
    <script type="module" src="/keyframes/js/navigation.js"></script>
    <script type="module" src="/keyframes/js/jumping-slime.js"></script>
    <script src="/gsap/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/GSDevTools.min.js"></script>

  </body>
</html>
