<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncing ball</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <h1 class="title">Bouncing Ball</h1>
      <!-- Control Buttons -->
      <div class="controls">
        <button class="play">Play</button>
        <button class="pause">Pause</button>
        <button class="restart">Restart</button>
        <button class="reverse">Reverse</button>
      </div>
      <div class="keyframes">
        <svg viewBox="0 0 100 200" class="bouncing-ball">
          <defs>
            <linearGradient
              id="grad-1"
              x1="30"
              y1="0"
              x2="70"
              y2="40"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0.2" stop-color="#0ae448" />
              <stop offset="0.5" stop-color="#abff84" />
            </linearGradient>
          </defs>
          <ellipse class="shadow" cx="50" cy="188" rx="15" ry="5" />

          <circle fill="url(#grad-1)" class="ball" cx="50" cy="22" r="15" />
        </svg>
      </div>
    </main>
    <script src="../gsap/gsap.min.js"></script>
    <script type="module" src="js/controls.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/bouncing-ball.js"></script>
  </body>
</html>
